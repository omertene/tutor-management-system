# Used on the server: adds Caddy in front, which handles HTTPS certificates.
# Only Caddy is exposed to the internet; everything else stays private.
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - frontend
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
