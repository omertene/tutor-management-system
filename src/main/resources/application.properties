spring.application.name=tutor-backend

# hosts like Render tell the app which port to listen on via PORT
server.port=${PORT:8080}

# comma-separated list of frontend origins allowed to call this API (CORS)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# files are stored as raw bytes in the materials table, so
# this cap also bounds how much a single upload can grow the database by
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tutor_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# generate a real one with: openssl rand -base64 64
jwt.secret=${JWT_SECRET}

# the one teacher account gets created automatically on startup if it doesn't exist yet
teacher.seed.email=${TEACHER_SEED_EMAIL:teacher@example.com}
teacher.seed.password=${TEACHER_SEED_PASSWORD}

# where to send the "a student booked a lesson" notification email - can be
# different from teacher.seed.email if the teacher checks a different inbox
teacher.notification.email=${TEACHER_NOTIFICATION_EMAIL:teacher@example.com}

# gmail SMTP - used to send lesson reminder emails. MAIL_PASSWORD is the
# 16-character Gmail "app password"
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# fail fast (5s) instead of hanging when the host blocks SMTP
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Brevo HTTPS email API - used instead of SMTP when BREVO_API_KEY is set (Render blocks SMTP).
# BREVO_SENDER_EMAIL must be a sender verified in the Brevo dashboard
brevo.api-key=${BREVO_API_KEY:}
brevo.sender-email=${BREVO_SENDER_EMAIL:}
brevo.sender-name=${BREVO_SENDER_NAME:TutorHub}

# JMS (ActiveMQ Artemis), embedded - runs inside this app, no separate broker to install.
# used for the lesson-reminder queue: a scheduled check publishes a message here, and a
# separate listener consumes it and sends the actual email
spring.artemis.mode=embedded
spring.artemis.embedded.enabled=true

# how many hours before a lesson its reminder email should go out - change this one
# number to adjust the timing, no code changes needed
reminder.hours-before=12
