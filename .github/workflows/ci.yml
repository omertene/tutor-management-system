name: CI

# runs on every push to main and on every pull request
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (build + tests)
    runs-on: ubuntu-latest

    # a throwaway PostgreSQL for the tests, started next to the job
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tutor_db
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d tutor_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # test-only values: nothing here is a real secret
    env:
      DB_URL: jdbc:postgresql://localhost:5432/tutor_db
      DB_USERNAME: ci
      DB_PASSWORD: ci-password
      JWT_SECRET: LhzLfRnMRa9nTAAIGBM0hghinQczir0uhdNykwA/1hkVGG4Y4kjGxE4iajMxhb0Os/uISbZSRCCzNoK5zz+RRw==
      TEACHER_SEED_EMAIL: ci@example.com
      TEACHER_SEED_PASSWORD: ci-password-123
      MAIL_USERNAME: ci@example.com
      MAIL_PASSWORD: ci-mail-password

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Build and run the tests
        run: chmod +x mvnw && ./mvnw -B verify

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          VITE_API_URL: /api
